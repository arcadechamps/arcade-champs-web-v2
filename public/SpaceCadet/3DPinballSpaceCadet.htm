<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Arcade Champs - 3D Pinball Space Cadet</title>

<link rel="stylesheet" href="3DPinballSpaceCadet.css">
</head>

<body>
	<div class="pleasewait">
		<div class="lds-spinner">
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
	</div>
	<canvas id="canvas"></canvas>
	<div class="gui_container">
		<div class="gui_background"></div>
		<div class="gui_controls"><span class="gui_controls_key">LEFT FLIPPER =
			</span>Z&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="gui_controls_key">RIGHT FLIPPER = </span>C<br><span
				class="gui_controls_key">TILT FLIPPER TABLE = </span>X&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span
				class="gui_controls_key">LAUNCH BALL = </span>SPACE<br><span class="gui_controls_key">RESTART GAME =
			</span>R&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="gui_controls_key">ENABLE/DISABLE! SOUND = </span>T</div>

		<div class="gui_start"></div>
	</div>
	<!-- Settings Management -->
	<script>
				function getBooleanSetting(settingName) {
					try {
						const name = "pinballspacecadet" + settingName;
						const nameEQ = name + "=";
						const ca = document.cookie.split(";");
						for (let i = 0; i < ca.length; i++) {
							const c = ca[i];
							while (c.charAt(0) == " ") {
								c = c.substring(1, c.length);
							}
							if (c.indexOf(nameEQ) == 0) {
								if (c.substring(nameEQ.length, c.length) == "true") {
									return true;
								} else {
									return false;
								}
							}
						}
					} catch (err) {
					}
					return true;
				}

				function setBooleanSetting(settingName, settingValue) {
					try {
						const name = "pinballspacecadet" + settingName;
						const value = String(settingValue);
						const days = 999;
						const expires = "";
						if (days) {
							const date = new Date();
							date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
							expires = "; expires=" + date.toUTCString() + "; SameSite=Lax";
						}
						document.cookie = name + "=" + (value || "") + expires + "; Secure; path=/";
					} catch (err) {
					}
				}
</script>

	<!-- Patch WebGL context for preserveDrawingBuffer (required for screenshots & recording) -->
	<script>
		(function () {
			var origGetContext = HTMLCanvasElement.prototype.getContext;
			HTMLCanvasElement.prototype.getContext = function (type, attrs) {
				if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
					attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
				}
				return origGetContext.call(this, type, attrs);
			};
		})();
	</script>

	<!-- Emscripten Module Configuration -->
	<script>
				// "Module" is used to load the game to the browser:

		/*
		Configure Emscripten Module: This object acts as the bridge between the compiled 
		C++ engine (3DPinballSpaceCadet.js) and the browser. It defines the rendering 
		canvas, handles standard I/O (silenced here), and manages game lifecycle hooks.

		⚠️ We are using var keyword here because : "Module' has already been declared (at 3DPinballSpaceCadet.js:1:1)
		*/
				var Module = {
					preRun: [],
					postRun: [],
					print: function () { }(),
					printErr: function (e) { },
					canvas: function () {
						var e = document.getElementById("canvas");
						// CRITICAL: preventDefault() tells the browser we want to recover
						// the context. Without it, the context is permanently lost.
						e.addEventListener("webglcontextlost", function (evt) {
							evt.preventDefault();
							console.warn('[SpaceCadet] WebGL context lost — waiting for restore');
						}, false);
						e.addEventListener("webglcontextrestored", function () {
							console.log('[SpaceCadet] WebGL context restored');
						}, false);
						return e;
					}(),
					setStatus: function (e) { },
					totalDependencies: 0,
					monitorRunDependencies: function (e) { }
				};

				const GAME_SOUND_ENABLED = getBooleanSetting("GAME_SOUND_ENABLED");
</script>

	<!-- Keyboard Event Handlers -->
	<script>
		// Handle key remapping: 'c' -> '/', 'r' -> 'F2'
		document.addEventListener("keydown", function (event) {
			if (event.key === "c") {
				const keySlash = new KeyboardEvent("keydown", {
					key: "/",
					code: "Slash",
					which: 191,
					keyCode: 191,
					shiftKey: false,
					ctrlKey: false,
					altKey: false,
					metaKey: false,
					bubbles: true,
					cancelable: true
				});
				document.getElementById("canvas").dispatchEvent(keySlash);
			}
			else if (event.key === "r") {
				const keyF2 = new KeyboardEvent("keydown", {
					key: "F2",
					code: "F2",
					which: 113,
					keyCode: 113,
					shiftKey: false,
					ctrlKey: false,
					altKey: false,
					metaKey: false,
					bubbles: true,
					cancelable: true
				});
				document.getElementById("canvas").dispatchEvent(keyF2);
			}
		});

				// Handle keyup events and sound toggle
		document.addEventListener("keyup", function (event) {
			if (event.key === "c") {
				const keySlash = new KeyboardEvent("keyup", {
					key: "/",
					code: "Slash",
					which: 191,
					keyCode: 191,
					shiftKey: false,
					ctrlKey: false,
					altKey: false,
					metaKey: false,
					bubbles: true,
					cancelable: true
				});
				document.getElementById("canvas").dispatchEvent(keySlash);
			}
			else if (event.key === "r") {
				const keyF2 = new KeyboardEvent("keyup", {
					key: "F2",
					code: "F2",
					which: 113,
					keyCode: 113,
					shiftKey: false,
					ctrlKey: false,
					altKey: false,
					metaKey: false,
					bubbles: true,
					cancelable: true
				});
				document.getElementById("canvas").dispatchEvent(keyF2);
			}
			else if (event.key === "t") {
				if (!Module.SDL2) {
					return;
				}

				GAME_SOUND_ENABLED = !GAME_SOUND_ENABLED;
				setBooleanSetting("GAME_SOUND_ENABLED", GAME_SOUND_ENABLED);

				try {
					if (!GAME_SOUND_ENABLED) {
						Module.SDL2.audioContext.suspend();
					}
					else {
						Module.SDL2.audioContext.resume();
					}
				} catch (err) {
				}
			}
		});
</script>

	<!-- Context Menu Prevention -->
	<script>
		// Prevent right-click context menu on canvas
		document.getElementById("canvas").addEventListener("contextmenu", function (event) {
			event.preventDefault();
		});
</script>

	<!-- Window Event Handlers -->
	<script>
			// Handle window load event
			window.addEventListener("load", function () {
			// Load game (works in iframe too)
			document.getElementsByClassName("gui_start")[0].addEventListener("click", function (event) {
			document.getElementsByClassName("gui_container")[0].style.display = "none";
			document.getElementsByClassName("pleasewait")[0].style.display = "block";

			const scriptGame = document.createElement("script");
			scriptGame.src = "3DPinballSpaceCadet.js";
			scriptGame.onload = function() {
				window.parent.postMessage({ type: 'emulator_game_start' }, '*');
			};
			document.getElementsByTagName("body")[0].appendChild(scriptGame);
			});
		});

			// Handle window resize — CSS handles visual scaling.
			// Do NOT call Module.setCanvasSize() as it can trigger WebGL context loss.
			// The canvas CSS (width: 100%; height: 100%) handles display scaling.
			const origWinAdd = window.addEventListener;
			window.addEventListener = function(type, listener, options) {
				if (type === 'resize' || type === 'fullscreenchange') {
					console.log('[SpaceCadet] Blocked', type, 'event listener to prevent WebGL context loss.');
					return;
				}
				return origWinAdd.call(window, type, listener, options);
			};
			const origDocAdd = document.addEventListener;
			document.addEventListener = function(type, listener, options) {
				if (type === 'fullscreenchange') {
					console.log('[SpaceCadet] Blocked document fullscreenchange listener.');
					return;
				}
				return origDocAdd.call(document, type, listener, options);
			};
</script>

	<!-- Message Handler (Recording handled by RecordRTC at parent level) -->
	<script>
			// Listen for commands from parent React app
			// Recording is now handled by RecordRTC at the parent level (GamePlayer.tsx)
		window.addEventListener('message', function(e) {
			if (e.data?.type === 'CAPTURE_SCREENSHOT') takeScreenshot();
		});
	</script>

	<!-- Screenshot Functionality -->
	<script>
			// Direct canvas screenshot (preserveDrawingBuffer patch enables this)
			function takeScreenshot() {
			try {
				var canvas = document.getElementById('canvas');
				if (!canvas) {
					console.error('[SpaceCadet] Canvas element not found');
					return;
				}

				var dataUrl = canvas.toDataURL('image/png');
				if (dataUrl && dataUrl.length > 500) {
					console.log('[SpaceCadet] Screenshot captured (' + canvas.width + 'x' + canvas.height + ')');
					window.parent.postMessage({
						type: 'emulator_screenshot',
						data: dataUrl
					}, '*');
				} else {
					console.warn('[SpaceCadet] Screenshot data too small, skipping');
				}
			} catch (err) {
				console.error('[SpaceCadet] Screenshot error:', err);
			}
		}
	</script>
</body>

</html>
